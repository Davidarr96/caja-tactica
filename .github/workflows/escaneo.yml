name: Escaneo diario Caja Táctica

on:
  schedule:
    # Lunes a viernes 21:40 UTC = 18:40 hora de Argentina (después del cierre de Wall Street todo el año)
    - cron: "40 21 * * 1-5"
  workflow_dispatch:
    inputs:
      modo:
        description: "resumen = escaneo completo · prueba = solo un mensaje de prueba"
        type: choice
        options: [resumen, prueba]
        default: resumen

jobs:
  escanear:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scan.py ${{ inputs.modo == 'prueba' && '--prueba' || '' }}
        env:
          # Canal de ntfy: suscribite a este nombre en la app ntfy. Es privado mientras nadie más lo conozca.
          NTFY_TOPIC: caja-tactica-7181b1c7a6
          # Opcional: Telegram (cargar como secretos del repositorio)
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SOLO_NOVEDADES: ${{ vars.SOLO_NOVEDADES }}
